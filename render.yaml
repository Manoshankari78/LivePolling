services:
  - type: web
    name: pulse-poll-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: live_polling
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_HOURS
        value: 24
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
